name: Inspect the demo recording setup
on:
  push:
    branches: [demo-v2-production]
    paths: ['demo-production-v2/probe.cjs', '.github/workflows/demo-v2-pilot.yml']
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-v2-production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm ci
      - name: Install render tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb
      - run: npm run build
      - name: Benchmark full-resolution product capture
        run: xvfb-run -a npx electron --no-sandbox demo-production-v2/probe.cjs
      - name: Inspect the previous evidence scene
        run: ffmpeg -y -i demo/inflect-demo.mp4 -vf "fps=1/12,scale=480:270,tile=4x3" -frames:v 1 demo-production-v2/output/previous-contact.jpg
      - name: Prepare review frames
        run: |
          python - <<'PY'
          import base64,json,pathlib
          out=pathlib.Path('demo-production-v2/output')
          data={p.stem:base64.b64encode(p.read_bytes()).decode() for p in out.glob('*.jpg')}
          data['probe']=json.loads((out/'probe.json').read_text())
          (out/'preview.json').write_text(json.dumps(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-production-v2/output/preview.json
          git commit -m "Save demo capture inspection frames"
          git push origin HEAD:demo-v2-production
      - uses: actions/upload-artifact@v4
        with:
          name: inflect-demo-pilot
          path: demo-production-v2/output
          retention-days: 7
